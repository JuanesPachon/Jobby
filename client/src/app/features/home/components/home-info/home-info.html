<section class="container w-full mx-auto p-2">
  <h2 class="text-3xl font-bold mb-15 text-center">
    ¿Por qué usar <span class="text-blue-600">Jobby</span>?
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
    <button (click)="setTab(1)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 1 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      🔍 ¿Cómo funciona?
    </button>

    <button (click)="setTab(2)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 2 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      🛠 Servicios disponibles
    </button>

    <button (click)="setTab(3)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 3 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      🕒 Flexibilidad laboral
    </button>

    <button (click)="setTab(4)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 4 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      🌟 Calificaciones
    </button>

    <button (click)="setTab(5)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 5 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      🤝 Seguridad
    </button>

    <button (click)="setTab(6)" class="tab-button p-4 mb-2 transition duration-300 ease-in-out hover:bg-main-blue/30 border-[1px] border-black rounded-xl shadow cursor-pointer"
      [ngClass]="activeTab() === 6 ? 'text-white bg-main-blue hover:bg-main-blue/100' : ''">
      💬 Conexión directa
    </button>
  </div>

  @for (tab of tabInfo; track tab.id) {
    @if (activeTab() === tab.id) {
      <article class="tab-content p-4 mb-6 border-[1px] border-black rounded-xl shadow">
        <h3 class="text-xl font-semibold mb-2">{{ tab.title }}</h3>
        <p>{{ tab.content }}</p>
      </article>
    }
  }

  <div class="py-8 text-center">
    <p class="text-lg mb-8">¿Listo para empezar?</p>
    <a href="" class="bg-blue-600 text-white border-[1px] border-black py-3 px-4 rounded-full shadow hover:bg-blue-700">Regístrate
      ahora</a>
  </div>
</section>
