<main class="relative mx-auto font-poppins max-w-[2200px] bg-[#f5f0ec]">
  <!-- Barra superior con logo y usuario -->
  <app-dashboard-navbar/>

  <!-- Navbar debajo -->
  <nav class="w-full bg-white flex justify-center border-t border-b">
    <a
      [routerLink]="'/dashboard'"
      class="flex items-center justify-center w-1/2 px-6 py-3 border-r hover:bg-gray-100"
    >
      <!-- Aquí va la ruta del ícono -->
      <img
        src="/icons/file_icon.svg"
        alt="Icono postular"
        class="w-5 h-5 mr-2"
      />
      Postular
    </a>
    <a
      routerLink="/post-task"
      class="flex items-center justify-center w-1/2 px-6 py-3 border-b-2 border-main-blue font-semibold text-main-blue"
    >
      <!-- Aquí va la ruta del ícono -->
      <img
        src="/icons/sticky_icon.svg"
        alt="Icono publicar"
        class="w-5 h-5 mr-2"
      />
      Publicar
    </a>
  </nav>

  <!-- Imagen de fondo con título -->
  <section class="relative h-[200px] w-full flex items-center justify-center">
    <!-- Aquí va la ruta de la imagen -->
    <img
      src="/images/WebP/imag-postular_tarea.png"
      alt="Imagen de fondo"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-black/50"></div>
    <h1 class="relative z-10 text-white text-2xl font-semibold">
      Publicar tarea
    </h1>
  </section>

  <!-- Formulario -->
  <section class="flex justify-center py-10 px-4">
    <form class="bg-white rounded-md shadow p-6 w-full max-w-lg border border-black">
      <h2 class="text-center font-semibold mb-4">Datos de la tarea</h2>
      <hr class="mb-6" />

      <!-- Inputs normales -->
      <div class="flex flex-col mb-4">
        <label class="mb-1 font-medium text-sm">Título *</label>
        <input type="text" class="px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
      </div>

      <div class="flex flex-col mb-4">
        <label class="mb-1 font-medium text-sm">Cargo *</label>
        <input type="text" class="px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
      </div>

      <div class="flex flex-col mb-6">
        <label class="mb-1 font-medium text-sm">Descripción *</label>
        <textarea class="px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none resize-none" rows="4" ></textarea>
      </div>

      <!-- Inputs horizontales -->
      <div class="space-y-4 mb-6">
        <div class="flex items-center justify-between">
          <label class="w-1/3 font-medium text-sm">Ciudad *</label>
          <input type="text" class="px-3.5 md:px-3 w-2/3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
        </div>

        <div class="flex items-center justify-between">
          <label class="w-1/3 font-medium text-sm">Barrio *</label>
          <input type="text" class="px-3.5 md:px-3 w-2/3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
        </div>

        <div class="flex items-center justify-between">
          <label class="w-1/3 font-medium text-sm">Tiempo laboral *</label>
          <input type="text" class="px-3.5 w-2/3 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
        </div>

        <div class="flex items-center justify-between">
          <label class="w-1/3 font-medium text-sm">Sueldo *</label>
          <input type="text" class="px-3.5 w-2/3 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none" />
        </div>
      </div>

      <!-- Botón -->
      <button
        type="submit"
        class="w-full mt-4 cursor-pointer bg-main-blue hover:bg-blue-600 text-white px-7 py-2 rounded-full font-medium text-sm border-[1px] border-black"
      >
        Publicar
      </button>

    </form>
  </section>
</main>
<!-- Footer -->
<footer class="w-full border-t border-black">
    <div class="mx-auto pt-3 pb-3 flex items-center justify-between px-4 container">
      <p class="text-xs md:text-xs text-black">© ADSO - 2025</p>
      <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="h-5 sm:h-6" />
    </div>
</footer>
