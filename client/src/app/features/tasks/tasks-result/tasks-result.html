<div class="min-h-screen flex flex-col">
    <app-dashboard-navbar />

    <div class="border-b shadow-sm">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center gap-2 xs:gap-2 sm:gap-4 lg:gap-6">
                <button class="p-1 xs:p-2 sm:p-3 cursor-pointer flex-shrink-0" 
                    [routerLink]="'/dashboard'">
                    <img src="/icons/return-pg_icon.svg" alt="Regresar" class="w-8 h-8 xs:w-5 xs:h-5 sm:w-6 sm:h-6 lg:w-7 lg:h-7" />
                </button>
                
                <div class="flex-1 flex justify-center min-w-0">
                    <div class="flex border-2 border-black rounded-lg sm:rounded-2xl overflow-hidden shadow-md bg-white w-full max-w-5xl min-w-0">
                        <div class="flex items-center px-2 xs:px-3 sm:px-4 lg:px-6 py-2 xs:py-3 sm:py-4 w-[47%] border-r border-black min-w-0">
                            <img src="/icons/file_icon.svg" alt="Trabajo" class="w-3 h-3 xs:w-4 xs:h-4 sm:w-5 sm:h-5 mr-1 xs:mr-2 sm:mr-3 flex-shrink-0" />
                            <input 
                                type="text" 
                                placeholder="Jardinero" 
                                class="flex-1 outline-none text-xs xs:text-sm sm:text-base font-medium text-gray-800 placeholder-gray-500 min-w-0 w-0"
                                value="Jardinero"
                                readonly
                            />
                        </div>
                        <div class="flex items-center px-2 xs:px-3 sm:px-4 lg:px-6 py-2 xs:py-3 sm:py-4 w-[55%] min-w-0">
                            <svg class="w-3 h-3 xs:w-4 xs:h-4 sm:w-5 sm:h-5 mr-1 xs:mr-2 sm:mr-3 text-gray-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                            </svg>
                            <input 
                                type="text" 
                                placeholder="Fusagasugá" 
                                class="flex-1 outline-none text-xs xs:text-sm sm:text-base font-medium text-gray-800 placeholder-gray-500 min-w-0 w-0"
                                value="Fusagasugá"
                                readonly
                            />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 min-h-0">
        <div class="container mx-auto px-4 py-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 animate-in fade-in-0 slide-in-from-bottom-4 duration-700">
                @for (task of [1,2,3,4,5,6,7,8]; track $index) {
                    <app-task-card />
                }
            </div>
        </div>
    </main>

    <footer class="w-full border-t border-black mt-auto">
        <div
        class="mx-auto pt-3 pb-3 flex items-center justify-between px-4 container"
        >
        <p class="text-xs md:text-xs text-black">© ADSO - 2025</p>
        <img
            src="/images/LOGO/png_sin_fondo/fondo_blanco.png"
            alt="Jobby Logo"
            class="h-5 sm:h-6"
        />
        </div>
    </footer>

    <button
        class="fixed bottom-6 right-6 w-12 h-12 bg-[#EBC636] text-gray-900 rounded-full shadow-lg hover:bg-yellow-500 hover:scale-110 hover:shadow-xl hover:shadow-yellow-400/40 transition-all duration-300 ease-out flex items-center justify-center z-50"
        aria-label="Ayuda"
    >
        <span class="text-xl font-bold">?</span>
    </button>
</div>
