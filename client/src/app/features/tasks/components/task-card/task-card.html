<!-- Mobile card -->

<div class="bg-white border border-black rounded-2xl shadow-md">
  <div class="block lg:hidden">
    <div class="flex p-4 gap-4">
      <div class="flex flex-col items-center flex-shrink-0">
        <img
          [src]="creatorAvatar"
          alt="Avatar"
          class="w-12 h-12 sm:w-16 sm:h-16 md:w-14 md:h-14 rounded-full border object-cover mb-2"
        />
        <p class="text-xs sm:text-sm md:text-xs font-medium text-black text-center mb-1">{{creatorName}}</p>
        <div class="flex items-center gap-1">
          <img src="/icons/star_icon.svg" alt="star" class="w-3 h-3" />
          <span class="text-xs text-gray-600">4.96</span>
        </div>
      </div>
      <div class="w-px bg-black flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-start mb-3">
          <h3 class="text-lg sm:text-xl md:text-lg font-semibold text-black truncate pr-2 flex-1 min-w-0">{{displayTask.title}}</h3>
          <span class="text-xs sm:text-sm text-gray-500 flex-shrink-0 ml-2">{{formattedDate}}</span>
        </div>
        <div class="flex items-center gap-4 sm:gap-6 mb-4">
          <div class="flex items-center gap-1">
            <img src="/icons/coins_icon.svg" alt="money" class="w-4 h-4 sm:w-5 sm:h-5" />
            <span class="text-sm sm:text-base md:text-sm font-medium text-black">{{formattedSalary}}</span>
          </div>
          <div class="flex items-center gap-1">
            <img src="/icons/Clock_icon.svg" alt="time" class="w-4 h-4 sm:w-5 sm:h-5" />
            <span class="text-sm sm:text-base md:text-sm font-medium text-black">{{durationText}}</span>
          </div>
        </div>
        <div class="flex gap-2">
          <button
            class="flex-1 h-9 sm:h-10 md:h-9 rounded-lg bg-white hover:bg-gray-100 text-black text-xs sm:text-sm font-medium border border-black transition-colors cursor-pointer"
            type="button"
            [routerLink]="taskDetailLink"
            [queryParams]="queryParams"
          >
            Ver más
          </button>
          <button
            [class]="mobileApplyButtonClass"
            type="button"
            (click)="applyToTask()"
            [disabled]="!canApply"
            class="flex-1"
          >
            {{ applyButtonText }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="hidden lg:flex p-5 xl:p-6 gap-4">
    <div class="flex flex-col items-center flex-shrink-0">
      <img
        [src]="creatorAvatar"
        alt="Avatar"
        class="w-16 h-16 xl:w-18 xl:h-18 rounded-full border object-cover mb-2"
      />
      <p class="text-sm xl:text-base font-medium text-black text-center mb-1">{{creatorName}}</p>
      <div class="flex items-center gap-1">
        <img src="/icons/star_icon.svg" alt="star" class="w-3 h-3 xl:w-4 xl:h-4" />
        <span class="text-xs xl:text-sm text-gray-600">4.96</span>
      </div>
    </div>
    <div class="w-px bg-black flex-shrink-0"></div>
    <div class="flex-1 min-w-0">
      <div class="flex justify-between items-start mb-3 xl:mb-4">
        <h3 class="text-lg xl:text-xl font-semibold text-black truncate pr-2 flex-1 min-w-0">{{displayTask.title}}</h3>
        <span class="text-sm xl:text-base text-gray-500 flex-shrink-0 ml-2">{{formattedDate}}</span>
      </div>
      <div class="flex items-center gap-6 xl:gap-8 mb-4 xl:mb-5">
        <div class="flex items-center gap-2">
          <img src="/icons/coins_icon.svg" alt="money" class="w-4 h-4 xl:w-5 xl:h-5" />
          <span class="text-base xl:text-lg font-medium text-black">{{formattedSalary}}</span>
        </div>
        <div class="flex items-center gap-2">
          <img src="/icons/Clock_icon.svg" alt="time" class="w-4 h-4 xl:w-5 xl:h-5" />
          <span class="text-base xl:text-lg font-medium text-black">{{durationText}}</span>
        </div>
      </div>
      <div class="flex justify-end items-center gap-3 xl:gap-4">
        <button
          class="px-6 xl:px-8 h-[35px] xl:h-[40px] rounded-full border border-black text-sm bg-white hover:bg-gray-100 whitespace-nowrap font-medium cursor-pointer"
          type="button"
          [routerLink]="taskDetailLink"
          [queryParams]="queryParams"
        >
          Más información
        </button>
        <button
          [class]="applyButtonClass"
          type="button"
          (click)="applyToTask()"
          [disabled]="!canApply"
        >
          {{ applyButtonText }}
        </button>
      </div>
    </div>
  </div>
</div>
