@if (isOpen()) {
<div
    class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200"
    (click)="handleBackdropClick($event)"
>
    <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full mx-4 border-2 border-black shadow-lg animate-in zoom-in-95 slide-in-from-bottom-4 duration-200"
    >
        <div class="flex items-center justify-center mb-6">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mb-2">
                <svg
                    class="w-6 h-6 text-red-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"
                    ></path>
                </svg>
            </div>
        </div>

        <h2 class="text-xl font-bold text-center text-gray-900 mb-4 font-poppins">
            ¿Quieres cancelar la tarea?
        </h2>

        <p class="text-gray-600 text-center mb-6 font-poppins text-sm sm:text-base leading-relaxed">
            Esta acción no se puede revertir. La tarea será marcada como cancelada y no podrás
            reactivarla.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
            <button
                type="button"
                (click)="handleCancel()"
                [disabled]="isLoading()"
                class="flex-1 px-4 py-2 text-sm font-medium text-black bg-white border border-black rounded-full hover:bg-gray-300 focus:outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-poppins cursor-pointer"
            >
                No, mantener
            </button>

            <button
                type="button"
                (click)="handleConfirm()"
                [disabled]="isLoading()"
                [class]="isLoading() 
            ? 'flex-1 px-4 py-2 text-sm font-medium text-white bg-gray-400 border border-gray-400 rounded-full cursor-not-allowed font-poppins flex items-center justify-center'
            : 'cursor-pointer rounded-full flex-1 px-4 py-2 text-sm font-medium text-white bg-main-blue border border-black hover:bg-blue-600 transition-colors font-poppins'"
            >
                @if (isLoading()) {
                <svg
                    class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"
                    ></circle>
                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                    ></path>
                </svg>
                Cancelando... } @else { Cancelar tarea }
            </button>
        </div>
    </div>
</div>
}
