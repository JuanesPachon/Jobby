<div class="min-h-screen flex items-center justify-center font-poppins bg-cover bg-center bg-[url('/images/WebP/dashboard_inicio_sesion.webp')]">
  <main class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md relative font-poppins ">
    
    <!-- Botón atrás -->
    <button class="absolute top-4 left-4">
      <img src="/icons/return-pg_icon.svg" alt="Atrás" class="w-5 h-5">
    </button>

    <!-- Icono ayuda -->
    <button class="absolute top-4 right-4">
      <img src="/icons/help_icon.svg" alt="Ayuda" class="w-5 h-5">
    </button>

    <!-- Logo -->
    <div class="text-center mb-4">
      <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="h-7 md:h-9">
    </div>

    <!-- Título -->
    <h2 class="text-center text-xl font-semibold mb-6">Inicio de sesión</h2>

    <!-- Formulario -->
    <form>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-1">Correo *</label>
        <input id="email" type="email" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="mb-2">
        <label for="password" class="block text-sm font-medium mb-1">Contraseña *</label>
        <input id="password" type="password"  class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="text-right mb-4">
        <a href="#" class="text-xs text-blue-600 hover:underline">¿Ha olvidado su contraseña?</a>
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 mb-3">
        Iniciar sesión
      </button>

      <!-- Botón Google -->
      <button type="button" class="w-full flex items-center justify-center border border-gray-300 py-2 rounded-md mb-3">
        <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_64dp.png" alt="Google" class="w-5 h-5 mr-2">
        Iniciar con Google
      </button>

      <!-- Separador -->
      <div class="flex items-center justify-center my-4">
        <span class="border-t border-gray-300 w-1/5"></span>
        <span class="mx-2 text-gray-500 text-sm">o</span>
        <span class="border-t border-gray-300 w-1/5"></span>
      </div>

      <!-- Link crear cuenta -->
      <p class="text-center text-sm mb-2">¿No tienes una cuenta?</p>
      <a href="#" class="block w-full bg-yellow-400 text-black text-center py-2 rounded-md hover:bg-yellow-500">
        Crear una cuenta
      </a>
    </form>
    <!-- copyright-->
    <div class="mt-6 border-t border-gray-400 pt-3 flex items-center justify-between">
      <p class="text-xs text-black">© ADSO - 2025</p>
      <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="h-5 md:h-6" />
    </div>

  </main>
</div>
