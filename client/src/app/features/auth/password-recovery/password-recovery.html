<div class="min-h-screen sm:flex sm:items-center sm:justify-center font-poppins bg-cover bg-center bg-[url('/images/WebP/dashboard_inicio_sesion.webp')]">
  <main class="bg-white sm:rounded-2xl shadow-xl p-6 md:p-6 pb-3 w-full sm:max-w-xl sm:mt-8 sm:mb-8 2xl:mt-0 2xl:mb-0 relative min-h-screen sm:min-h-0 flex flex-col justify-center">
    
    <a class="absolute top-7 left-7">
      <img src="/icons/return-pg_icon.svg" alt="Atrás" class="w-7 h-7 md:w-7 md:h-7">
    </a>

    <a class="absolute top-7 right-7">
      <img src="/icons/help_icon_2.svg" alt="Ayuda" class="w-7 h-7 md:w-7 md:h-7">
    </a>

    <div class="flex-grow flex flex-col justify-center py-6 md:py-0">

      <div class="mb-5 md:mt-4 md:mb-4 text-center">
        <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="mx-auto h-16 md:h-14" />
      </div>

      <h2 class="text-2xl md:text-2xl font-semibold text-center text-gray-800 mb-6 md:mb-6">Recuperación de contraseña</h2>

      @if (step() == 1) {
        <app-request-code/>
      }
      @else if (step() == 2) {
        <app-verify-code/>
      }
      @else {
        <app-reset-password/>
      }
    </div>

    <div class="mt-6 md:mt-6 border-t border-gray-400 pt-3 md:pt-3 flex items-center justify-between">
      <p class="text-xs md:text-xs text-black">© ADSO - 2025</p>
      <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="h-5 sm:h-6" />
    </div>

  </main>
</div>
