<form id="requestCodeForm">
  <div class="mb-5 md:mb-4">
    <label for="email" class="text-sm md:text-sm text-black block mb-1.5 md:mb-1">Correo de recuperación</label>
    <input id="email" name="email" type="email"
      class="w-full px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border rounded-md focus:ring-2 focus:ring-black focus:outline-none"
      formControlName="email" required>
  </div>
  <button type="submit"
    class="w-full border-1 mb-5 md:mb-4 cursor-pointer border-black bg-main-yelllow hover:bg-yellow-500 text-black text-sm md:text-sm py-2.5 md:py-2 rounded-xl transition">Enviar
  </button>

</form>
