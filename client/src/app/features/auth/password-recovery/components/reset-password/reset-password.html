<h2 class="text-lg md:text-2xl font-semibold text-center text-gray-800 mb-6 md:mb-6">¡se ha validado el código exitosamente!</h2>

<form id="resetPasswordForm">
  <div class="mb-5 md:mb-4">
    <label for="password" class="text-sm md:text-sm text-black block mb-1.5 md:mb-1">Nueva contraseña</label>
    <input id="password" name="password" type="password"
      class="w-full px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border rounded-md focus:ring-2 focus:ring-black focus:outline-none"
      formControlName="password" required>
  </div>
  <div class="mb-5 md:mb-4">
    <label for="new_password" class="text-sm md:text-sm text-black block mb-1.5 md:mb-1">Confirmar contraseña</label>
    <input id="new_password" name="new_password" type="new_password"
      class="w-full px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border rounded-md focus:ring-2 focus:ring-black focus:outline-none"
      formControlName="new_password" required>
  </div>

  <button type="submit"
    class="w-full border-1 mb-5 md:mb-4 cursor-pointer border-black bg-main-yelllow hover:bg-yellow-500 text-black text-sm md:text-sm py-2.5 md:py-2 rounded-xl transition">Actualizar
  </button>

</form>
