<p class="text-center py-3">Compruebe su correo electronico, se envío un código de verificación de 6 digitos</p>

<form id="verifyCodeForm">
  <div class="mb-5 md:mb-4">
    <label for="code" class="text-sm md:text-sm text-black block mb-1.5 md:mb-1">Codigo:</label>
    <input id="code" name="code" type="code"
      class="w-full px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border rounded-md focus:ring-2 focus:ring-black focus:outline-none"
      formControlName="code" required>
  </div>

  <button type="submit"
    class="w-full border-1 mb-5 md:mb-4 cursor-pointer border-black bg-main-blue hover:bg-blue-700 text-black text-sm md:text-sm py-2.5 md:py-2 rounded-xl transition">Enviar
  </button>

  <button type="submit"
    class="w-full border-1 mb-5 md:mb-4 cursor-pointer border-black bg-main-yelllow hover:bg-yellow-500 text-black text-sm md:text-sm py-2.5 md:py-2 rounded-xl transition">Reenviar
    codigo
  </button>

</form>
