<div
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 font-poppins"
    (click)="onOverlayClick($event)"
>
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-6 pb-2 border-b border-gray-200">
            <h2 class="text-2xl font-semibold text-gray-900">Cambiar foto de perfil</h2>
            <button
                class="text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
                (click)="closeModal()"
            >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"
                    />
                </svg>
            </button>
        </div>

        <div class="p-6">
            <form (ngSubmit)="$event.preventDefault()" class="space-y-6">
                @if (!previewUrl()) {
                <div>
                    <label class="block text-sm font-medium text-gray-900 mb-3">
                        Selecciona una foto de perfil
                    </label>
                    <div
                        class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-main-blue transition-colors"
                    >
                        <input
                            type="file"
                            accept="image/*"
                            (change)="onFileSelected($event)"
                            [disabled]="isLoading()"
                            id="fileInput"
                            class="hidden"
                        />
                        <label for="fileInput" class="cursor-pointer flex flex-col items-center">
                            <div
                                class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4"
                            >
                                <svg
                                    class="w-10 h-10 text-gray-400"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                                    />
                                </svg>
                            </div>
                            <p class="text-sm font-medium text-gray-700 mb-1">
                                Haz clic para seleccionar una imagen
                            </p>
                            <p class="text-xs text-gray-500">PNG, JPG, JPEG, WEBP (máx. 10MB)</p>
                        </label>
                    </div>
                    @if (photoControl.hasError('required') && photoControl.touched) {
                    <small class="text-red-600 mt-2 block">Este campo es obligatorio</small>
                    }
                </div>
                } @else {
                <div>
                    <label class="block text-sm font-medium text-gray-900 mb-4 text-center">
                        Vista previa de tu nueva foto
                    </label>
                    <div class="flex flex-col items-center space-y-6">
                        <img
                            [src]="previewUrl()"
                            alt="Vista previa"
                            class="w-56 h-56 object-cover rounded-full border-4 border-black shadow-2xl"
                        />

                        <div class="bg-gray-50 rounded-lg p-4 w-full border border-gray-200">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 flex-1 min-w-0">
                                    <svg
                                        class="w-5 h-5 text-green-600 flex-shrink-0"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M5 13l4 4L19 7"
                                        />
                                    </svg>
                                    <span class="text-sm text-gray-700 truncate">
                                        {{ selectedFileName() }}
                                    </span>
                                </div>
                                <button
                                    type="button"
                                    (click)="cancelPreview()"
                                    class="ml-3 px-6 py-2 hover:bg-gray-300 rounded-full font-medium text-sm border-[1px] border-black cursor-pointer transition-all flex-shrink-0"
                                >
                                    Cambiar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                } @if (hasError()) {
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-center gap-2">
                        <svg
                            class="w-5 h-5 text-red-600 flex-shrink-0"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                            />
                        </svg>
                        <span class="text-red-700 text-sm">{{ errorMessage() }}</span>
                    </div>
                </div>
                }

                <div
                    class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-gray-200"
                >
                    <button
                        type="button"
                        (click)="closeModal()"
                        [disabled]="isLoading()"
                        class="px-6 py-2 hover:bg-gray-300 rounded-full font-medium text-sm border-[1px] border-black transition disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                    >
                        Cancelar
                    </button>
                    <button
                        type="button"
                        (click)="onSubmit()"
                        [disabled]="isLoading() || photoControl.invalid"
                        class="w-full sm:w-auto bg-main-blue hover:bg-blue-600 disabled:bg-gray-400 disabled:border-gray-400 disabled:text-gray-600 disabled:cursor-not-allowed disabled:opacity-60 text-white px-8 py-2 rounded-full font-medium text-sm border-[1px] border-black cursor-pointer transition"
                    >
                        @if (isLoading()) {
                        <span class="flex items-center gap-2">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                <circle
                                    class="opacity-25"
                                    cx="12"
                                    cy="12"
                                    r="10"
                                    stroke="currentColor"
                                    stroke-width="4"
                                ></circle>
                                <path
                                    class="opacity-75"
                                    fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                ></path>
                            </svg>
                            Subiendo...
                        </span>
                        } @else { Guardar foto }
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
