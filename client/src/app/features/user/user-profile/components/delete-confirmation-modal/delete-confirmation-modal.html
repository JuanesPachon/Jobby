<div
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 font-poppins"
    (click)="onOverlayClick($event)"
>
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
        <div class="p-6">
            <div
                class="flex items-center justify-center w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full border"
            >
                <svg
                    class="w-8 h-8 text-black"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"
                    />
                </svg>
            </div>

            <h3 class="text-lg font-semibold text-gray-900 text-center mb-3">
                Confirmar eliminación
            </h3>

            <p class="text-gray-600 text-center mb-6">
                ¿Estás seguro de que deseas eliminar {{ resourceType() }}
                <span class="font-semibold text-gray-900">"{{ resourceName() }}"</span>
                ?
                <br />
                <br />
                <span class="text-red-600 text-sm">Esta acción no se puede deshacer.</span>
            </p>

            <div class="flex gap-3">
                <button
                    (click)="onCancel()"
                    [disabled]="isDeleting()"
                    [class.opacity-50]="isDeleting()"
                    [class.cursor-not-allowed]="isDeleting()"
                    class="flex-1 hover:bg-gray-300 px-9 cursor-pointer py-2 rounded-xl font-medium text-sm border-[1px] border-black disabled:hover:bg-white disabled:cursor-not-allowed"
                >
                    Cancelar
                </button>
                <button
                    (click)="onConfirm()"
                    [disabled]="isDeleting()"
                    [class.opacity-50]="isDeleting()"
                    [class.cursor-not-allowed]="isDeleting()"
                    class="flex-1 bg-main-blue hover:bg-blue-600 text-white px-9 cursor-pointer py-2 rounded-xl font-medium text-sm border-[1px] border-black disabled:hover:bg-main-blue disabled:cursor-not-allowed flex items-center justify-center"
                >
                    @if (isDeleting()) {
                    <svg
                        class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                    >
                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4"
                        ></circle>
                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                        ></path>
                    </svg>
                    Eliminando... } @else { Eliminar }
                </button>
            </div>
        </div>
    </div>
</div>
