<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="onOverlayClick($event)">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-2xl font-semibold text-gray-900">
        {{ isEditing() ? 'Editar Experiencia' : 'Agregar Experiencia' }}
      </h2>
      <button class="text-gray-400 hover:text-gray-800 transition-colors cursor-pointer" (click)="closeModal()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="p-6">
      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-2">Puesto:</label>
            <input 
              type="text" 
              [value]="experienceData()?.title || ''"
              class="w-full placeholder:text-gray-500 px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none transition-all"
              placeholder="Ej. Desarrollador Frontend"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-2">Empresa:</label>
            <input 
              type="text" 
              [value]="experienceData()?.location || ''"
              class="w-full px-3.5 placeholder:text-gray-500 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none transition-all"
              placeholder="Ej. Tech Company S.A."
            >
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-2">Fecha Inicio:</label>
            <input 
              type="date" 
              [value]="getDateValue(experienceData()?.start_date)"
              class="w-full placeholder:text-gray-500 px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none transition-all"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-2">
              Fecha fin: 
              <span class="text-gray-500 font-normal">(vacío para actualmente)</span>
            </label>
            <input 
              type="date" 
              [value]="getDateValue(experienceData()?.end_date)"
              class="w-full placeholder:text-gray-500 px-3.5 md:px-3 py-2.5 md:py-2 text-sm md:text-sm border border-gray-400 rounded-md focus:ring-2 focus:ring-black focus:outline-none transition-all"
            >
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-main-blue hover:bg-blue-600 text-white px-9 cursor-pointer py-2 rounded-xl font-medium text-sm border-[1px] border-black">
            {{ isEditing() ? 'Guardar' : 'Agregar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
