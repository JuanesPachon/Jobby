<header class="container mx-auto p-3 font-poppins">
  <nav class="flex items-center justify-between px-2">
    <img src="/images/LOGO/png_sin_fondo/fondo_blanco.png" alt="Jobby Logo" class="h-10 object-contain">

     <!-- Mobile Menu  -->
    <img [ngClass]="menuOpen() ? 'bg-gray-400/50 rounded-md p-0.5 shadow-inner' : ''" (click)="toggleMenu()" class="w-14 h-10 lg:hidden self-center" src="/icons/menu_bar_piso.svg" alt="Menu">
        
     <!-- Desktop Menu -->
    <div class="hidden lg:flex gap-3">
      <a class="bg-main-yelllow hover:bg-main-yelllow text-black px-7 py-2 rounded-full font-medium text-sm border-[1px] border-black">
        Iniciar sesión
      </a>
      <a [routerLink]="'/register'" class="bg-main-blue hover:bg-main-blue text-white px-7 py-2 rounded-full font-medium text-sm border-[1px] border-black">
        Registrarse
      </a>
    </div>
  </nav>

  @if (menuOpen()) {
    <div class="lg:hidden fixed top-16 inset-0 bg-black/65 z-11" (click)="toggleMenu()"></div>

    <div class="absolute top-16 mt-2 right-4 z-50 bg-white rounded-lg shadow-lg flex flex-col p-2 divide-y">
      <a class="flex items-center w-full px-4 py-3 text-left font-semibold hover:bg-gray-100">
        <img src="/icons/bar_login.svg" alt="Iniciar sesión" class="h-5 w-5 mr-3" />
        Iniciar sesión
      </a>

      <a [routerLink]="'/register'" class="flex items-center w-full px-4 py-3 text-left font-semibold hover:bg-gray-100">
        <img src="/icons/bar_signup.svg" alt="Registrarse" class="h-5 w-5 mr-3" />
        Registrarse
      </a>
    </div>
  }

</header>
