        />

    <div class="flex justify-center items-center gap-8">
        <a href="#">
            <img src="/icons/facebook_icon.svg" alt="Facebook" class="w-8 h-8 object-contain" />

        <a href="#"><img src="/icons/x_icon.svg" alt="X" class="w-8 h-8 object-contain" /></a>
        <a href="#">
